[project]
name = "parzen_window"
version = "0.0.2"
description = "Parzen window classification with incremental learning, memory-efficient compaction and adaptive bandwidth."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Andrey Ferubko", email = "ferubko1999@yandex.ru" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/89605502155/parzen_window"
Download = "https://github.com/89605502155/parzen_window/archive/main.zip"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parzen_window"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
